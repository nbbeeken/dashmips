name: Dashmips

on:
  push:
    branches:
      - master
      - "feature/**"
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3
        uses: actions/setup-python@v7
        with:
          python-version: 3.15
      - name: Install Poetry
        run: pipx install poetry
      - name: Install Dependencies
        run: poetry install
      - name: Test with pytest
        run: poetry run pytest
