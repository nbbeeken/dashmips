on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - "*" # Push events to matching v*, i.e. v1.0, v20.15.10

name: Upload Release Asset

jobs:
  build:
    name: Upload Release Asset
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3
        uses: actions/setup-python@v7
        with:
          python-version: 3.15
      - name: Install Poetry
        run: pipx install poetry
      - name: Install Dependencies
        run: poetry install

      # makes ./dist/dashmips-{version}-py3-none-any.whl
      # file name is: {distribution}-{version}(-{build tag})?-{python tag}-{abi tag}-{platform tag}.whl
      - name: Build project
        run: poetry build -f wheel

      - name: Get the version
        id: get_version
        run: echo ::set-output name=VERSION::${GITHUB_REF/refs\/tags\//}
        shell: bash

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
          asset_path: ./dist/dashmips-${{ steps.get_version.outputs.VERSION }}-py3-none-any.whl
          asset_name: dashmips-${{ steps.get_version.outputs.VERSION }}-py3-none-any.whl
          asset_content_type: application/x-wheel+zip

      - name: Publish a Python distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
